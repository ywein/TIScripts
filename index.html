<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Invicta Atlas</title>
<style>
  :root { --sheet: #e4e2d9; --ink: #17212c; --ink-soft: #5b6672; --rule: #c9c6ba; }
  @media (prefers-color-scheme: dark) {
    :root { --sheet: #121820; --ink: #e3e6e4; --ink-soft: #97a2ac; --rule: #2c3743; }
  }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--sheet); color: var(--ink);
    font: 400 16px/1.55 "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  }
  nav { display: flex; gap: 4px; padding: 0 clamp(12px, 4vw, 32px); border-bottom: 1px solid var(--rule); }
  a {
    padding: 12px 16px; color: var(--ink-soft); text-decoration: none;
    border-bottom: 2px solid transparent; font-weight: 600;
  }
  a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
  iframe { flex: 1; width: 100%; border: 0; display: none; }
  iframe.on { display: block; }
</style>
<nav>
  <a href="#drives">Drives</a>
  <a href="#unifications">Unifications</a>
</nav>
<iframe id="drives" title="Drives" data-src="drives/fuel-efficiency-thrust.html"></iframe>
<iframe id="unifications" title="Unifications" data-src="unifications/unifications.html"></iframe>
<script>
  function show() {
    const id = location.hash.slice(1) || "drives";
    for (const frame of document.querySelectorAll("iframe")) {
      const on = frame.id === id;
      if (on && !frame.src) frame.src = frame.dataset.src;
      frame.classList.toggle("on", on);
    }
    for (const tab of document.querySelectorAll("nav a")) {
      if (tab.hash.slice(1) === id) tab.setAttribute("aria-current", "page");
      else tab.removeAttribute("aria-current");
    }
  }
  addEventListener("hashchange", show);
  show();
</script>
